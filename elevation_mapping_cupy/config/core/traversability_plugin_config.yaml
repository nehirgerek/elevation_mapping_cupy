# Geometric traversability-estimation pipeline (surface normals -> slope/step/roughness ->
# fusion -> occupancy -> ESDF), ported from ETH Zurich's traversability_estimation and
# grid_map_filters/NormalVectorsFilter. Loaded in ADDITION to plugin_config.yaml (see
# `extra_plugin_config_file` param / elevation_mapping.py) so this pipeline is independently
# toggleable from the digging-map cleanup chain without touching that file.
#
# Parameter provenance (see the implementation-plan writeup for full derivation):
#   Map resolution: 0.10 m.
#   Rover: 0.62 m x 0.48 m conservative footprint, wheel radius 0.105 m, wheel width 0.08 m,
#   circumscribed radius 0.392 m. Ground clearance, max climbable step, max safe slope, and
#   elevation noise have NOT been physically measured yet -- the values below are the
#   explicitly-provided conservative placeholders (critical_step=0.06m, critical_slope=0.52rad
#   /30deg, roughness_critical=0.04m, elevation noise ~0.01-0.02m), not upstream's own
#   legged-robot/fine-grid defaults, which would be invalid at this resolution (see the
#   estimation_radius note below). Re-tune once ground clearance / max step / max slope are
#   physically measured.
#
# NOTE on the "traversability" name collision: elevation_mapping.py already hardcodes
# "traversability" (core layer index 3) to the pre-existing torch/chainer edge-detector filter
# (elevation_mapping_cupy/traversability_filter.py) via an explicit dispatch branch that runs
# before the plugin-layer lookup. Naming the fused output here "traversability" would make it
# silently unreachable. The internal layer name is `geom_traversability`; publish it under a
# topic layer labeled "traversability" at the publisher level if you want that external name.

surface_normal_x:
  type: surface_normals
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "surface_normal_x"
  extra_params:
    input_layer_name: "inpaint"
    # 0.15m ~ a 3x3-cell disk at this 0.10m resolution (radii <=0.05m would only ever see the
    # center cell -- upstream's own 0.05m default is below this map's minimum usable radius of
    # 0.5*resolution=0.05m and was rejected for that reason). Chosen to roughly match the
    # rover's wheel scale (0.08m wheel width, 0.21m wheel diameter) without averaging away real
    # small terrain features under a wheel.
    estimation_radius: 0.15
    minimum_valid_cells: 6
    component: "x"
surface_normal_y:
  type: surface_normals
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "surface_normal_y"
  extra_params:
    input_layer_name: "inpaint"
    estimation_radius: 0.15
    minimum_valid_cells: 6
    component: "y"
surface_normal_z:
  type: surface_normals
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "surface_normal_z"
  extra_params:
    input_layer_name: "inpaint"
    estimation_radius: 0.15
    minimum_valid_cells: 6
    component: "z"

traversability_slope:
  type: slope_traversability
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "traversability_slope"
  extra_params:
    normal_z_layer_name: "surface_normal_z"
    # 0.52 rad = 30 deg: explicit conservative placeholder pending a measured max safe slope.
    critical_value: 0.52

roughness:
  type: roughness_traversability
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "roughness"
  extra_params:
    input_layer_name: "inpaint"
    normal_x_layer_name: "surface_normal_x"
    normal_y_layer_name: "surface_normal_y"
    normal_z_layer_name: "surface_normal_z"
    estimation_radius: 0.15
    critical_value: 0.04
    minimum_valid_cells: 5
    output: "roughness"
traversability_roughness:
  type: roughness_traversability
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "traversability_roughness"
  extra_params:
    input_layer_name: "inpaint"
    normal_x_layer_name: "surface_normal_x"
    normal_y_layer_name: "surface_normal_y"
    normal_z_layer_name: "surface_normal_z"
    estimation_radius: 0.15
    critical_value: 0.04
    minimum_valid_cells: 5
    output: "traversability"

step_height:
  type: step_traversability
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "step_height"
  extra_params:
    input_layer_name: "inpaint"
    critical_value: 0.04
    # first_window: local height-range probe, ~3x3 cells (unchanged). second_window: widened
    # to ~0.4m (~50-cell disk) to cover the rover's full circumscribed radius (0.392m) rather
    # than just its half-width (0.24m), so the "is this step spatially extensive" check
    # reasons about the whole footprint, not half of it. Kept identical to traversability_step
    # below -- these two entries must stay in sync, since step_height is only the
    # visualization/debug layer and traversability_step is what actually drives
    # geom_traversability/occupancy; a previous edit desynced them (critical_value 0.04/
    # critical_cell_number 2 here vs 0.06/4 there) without changing what occupancy saw.
    first_window_radius: 0.15
    second_window_radius: 0.4
    critical_cell_number: 4
    output: "step_height"
traversability_step:
  type: step_traversability
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "traversability_step"
  extra_params:
    input_layer_name: "inpaint"
    critical_value: 0.04
    first_window_radius: 0.15
    second_window_radius: 0.4
    critical_cell_number: 4
    output: "traversability"

geom_traversability:
  type: traversability_fusion
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "geom_traversability"
  extra_params:
    slope_layer_name: "traversability_slope"
    step_layer_name: "traversability_step"
    roughness_layer_name: "traversability_roughness"
    method: "mean"
    slope_weight: 1.0
    # Upweighted from 1.0 so a real step's low score isn't diluted by slope/roughness (which
    # are often still near 1.0 right next to a step) when averaged. 4.0 caused widespread
    # false-positive occupancy inflation -- step_traversability's raw score is noisy/unstable
    # across ordinary (non-step) terrain too (see step_traversability.py's module docstring),
    # and at weight 4.0 it dominates ~67% of the fused average, so that noise alone crosses
    # lethal_traversability_threshold far more often. 2.0 (~40% share) is a smaller amplification
    # of the same noise -- re-check live for inflation before pushing higher. Must stay in sync
    # with terrain_cost's step_weight below (this entry is the one occupancy actually consumes;
    # terrain_cost is visualization-only).
    step_weight: 2.0
    roughness_weight: 1.0
    allow_partial_average: False
    output: "traversability"
terrain_cost:
  type: traversability_fusion
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "terrain_cost"
  extra_params:
    slope_layer_name: "traversability_slope"
    step_layer_name: "traversability_step"
    roughness_layer_name: "traversability_roughness"
    method: "mean"
    slope_weight: 1.0
    step_weight: 2.0
    roughness_weight: 1.0
    allow_partial_average: False
    output: "terrain_cost"

occupancy:
  # Stateful, persistent occupancy (see persistent_occupancy.py) -- replaces the previous
  # stateless traversability_occupancy classification, which rebuilt -1/0/100 from scratch
  # every cycle and so let a single missing/uncertain/high-variance reading instantly
  # overwrite already-confirmed knowledge (the "free space turns to unknown" / "occupied
  # cells don't persist through noise" behavior). traversability_occupancy.py itself is left
  # in place, unused by this config, in case a stateless comparison is ever needed again.
  type: persistent_occupancy
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "occupancy"
  extra_params:
    traversability_layer_name: "geom_traversability"
    measured_validity_layer: "elevation"
    variance_layer: "variance"
    # UNVERIFIED placeholder: real observed variance on this map ranges from ~0.06 (best
    # case, well-observed flat ground) up to the initial/never-observed default of 1000 (see
    # core_param.yaml initial_variance) with a post-update cap of max_variance=100. Gates only
    # the FREE side of evidence here (see persistent_occupancy.py) -- a confident hazard
    # reading is never suppressed by high variance, matching this pipeline's existing
    # principle (curbs/edges legitimately carry higher variance than flat ground).
    maximum_variance: 50.0
    lethal_traversability_threshold: 0.35
    # Hysteresis evidence-accumulation parameters (see persistent_occupancy.py's module
    # docstring for the full model). No time-decay term exists -- a cell's confidence only
    # moves when THIS cycle produced direct occupied or free evidence for it.
    #   occupied_increment: how much confidence a single confidently-hazardous cycle adds.
    #   free_decrement: how much confidence a single reliably-free cycle subtracts.
    #   occupied_threshold / free_threshold: confidence must cross these to actually flip the
    #     stored state (hysteresis -- an ambiguous cycle alone can never flip an already-
    #     decided cell).
    #   minimum_confidence / maximum_confidence: hard clamp on the accumulator.
    #
    # Tuned for reactivity over stability (explicit tradeoff): minimum_confidence ==
    # free_threshold and maximum_confidence == occupied_threshold, and both increment/
    # decrement exceed the full confidence range. That means a SINGLE confidently-hazardous
    # or reliably-free cycle immediately saturates the accumulator to the opposite boundary
    # and flips the stored state right away, regardless of how much history the cell had
    # accumulated in the other direction -- a newly-appeared obstacle or a newly-vacated cell
    # shows up on the very next cycle instead of taking 3-4 cycles to overcome prior evidence.
    # Missing/uncertain/high-variance cycles still leave confidence (and state) untouched, so
    # this doesn't reintroduce the original stateless-flicker bug -- it only removes the
    # extra corroboration requirement for cycles that DO produce confident evidence. If this
    # proves too twitchy on noisy single-frame readings in practice, widen the gap between
    # minimum_confidence/maximum_confidence and the thresholds (and/or lower the increment/
    # decrement back below the full range) to require 2+ corroborating cycles again.
    occupied_increment: 4.0
    free_decrement: 4.0
    occupied_threshold: 2.0
    free_threshold: -2.0
    minimum_confidence: -2.0
    maximum_confidence: 2.0

esdf_metric:
  type: traversability_esdf
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "esdf_metric"
  extra_params:
    occupancy_layer_name: "occupancy"
    unknown_is_obstacle: True
    truncation_distance: 1.5
    output: "esdf_metric"
esdf_encoded:
  type: traversability_esdf
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "esdf_encoded"
  extra_params:
    occupancy_layer_name: "occupancy"
    unknown_is_obstacle: True
    # 1.5m: the task's own placeholder (2.25m) was tuned for a larger platform. This rover's
    # circumscribed radius is 0.392m; 1.5m gives ~4x that as a clearance horizon, enough for
    # local planning margin without wasting the encoding's resolution on distances far beyond
    # anything this rover's footprint needs to reason about. Re-tune once Mighty's actual
    # planning horizon for this platform is known.
    truncation_distance: 1.5
    output: "esdf_encoded"
